# vm/deploy.conf - the project-specific half of vm/utils. Sourced (bash).

# remote dir is /root/$PROJECT
PROJECT=otterly_site
SERVICE=otterly
TEST="mix test"
PROD_SSH_USR=luke@cachyserver
PROD_NETWORK=caddy
REGISTRY="registry.otterlyjs.org"
REGISTRY_URL=https://$REGISTRY
# optional, run on the server before `docker compose up -d`
PRE_UP=""

# called by vm/utils/serve inside the container. $1 is the project env.
# phoenix decrypts its own creds in config/config.exs.
serve_app() {
	case "$1" in
		development) export MIX_ENV=dev ;;
		production) export MIX_ENV=prod ;;
		*) export MIX_ENV="$1" ;;
	esac
	exec mix phx.server
}

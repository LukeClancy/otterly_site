x-vm-base: &x-vm-base
  logging:
    driver: "json-file"
    options:
      # 3 ten megabyte files with the oldest one deleted when you hit 4
      #
      # article: https://www.dash0.com/guides/docker-compose-logs
      # tail: docker compose logs <services> --tail 10 --follow
      # time-particular: docker compose logs --since "2025-11-24T08:00:00" --until "2025-11-24T08:15:00" <services>
      # time: docker compose logs --since 10m <services>
      max-size: "10m"
      max-file: "3"
  restart: always

name: otterly
services:
  # Writes vm/.env and vm/env/* to the host. Environment comes from the overlay's command.
  compose_config:
    hostname: otterly_compose_config
    container_name: otterly_compose_config
    build:
      dockerfile: utils/sops.Dockerfile
    volumes:
      - ..:/app
      - ${SOPS_AGE_KEY_FILE:-${HOME}/.config/sops/age/keys.txt}:/root/age_keys.txt:ro
    environment:
      - SOPS_AGE_KEY_FILE=/root/age_keys.txt
      - SOPS_AGE_KEY

  otterly:
    <<: *x-vm-base
    hostname: otterly
    container_name: otterly
    volumes:
      - ..:/app
    depends_on:
      compose_config:
        condition: service_completed_successfully
